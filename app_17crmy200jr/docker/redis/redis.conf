# ============================================================
# mutang Redis 配置文件
# 版本：Redis 7.x
# 用途：缓存、会话管理、分布式锁
# ============================================================

# ---------------------- 网络 ----------------------
# Docker 容器内需要绑定所有接口，由 Docker 网络安全组控制外部访问
bind 0.0.0.0
port 6379

# ---------------------- 安全 ----------------------
# 密码认证 —— 通过 docker-compose 环境变量 REDIS_PASSWORD 传入
# redis.conf 不支持环境变量插值，此处使用占位符。
# 实际部署时，docker-compose 的 command 会优先使用本配置文件，
# 密码通过 docker-compose 的 environment 传递给 healthcheck。
# 若需在 redis.conf 中硬编码密码，取消注释下一行并替换：
# requirepass your_strong_password_here

# Docker 内关闭保护模式，访问控制由 Docker 网络和防火墙负责
protected-mode no

# 禁用危险命令（生产环境建议）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG "CONFIG_b9fc832d"
# rename-command DEBUG ""

# ---------------------- 内存管理 ----------------------
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------------------- 持久化 ----------------------
# RDB 快照
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir /data

# AOF 日志
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---------------------- 慢查询日志 ----------------------
# 10ms（10000 微秒）以上的操作记录为慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------------------- 连接 ----------------------
timeout 300
tcp-keepalive 60
maxclients 10000

# ---------------------- 日志 ----------------------
loglevel notice
logfile ""

# ---------------------- 延迟监控 ----------------------
latency-monitor-threshold 100

# ---------------------- 数据结构优化 ----------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ---------------------- 主动碎片整理 ----------------------
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100